name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "src/ui/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Verify static dashboard files
        shell: bash
        run: |
          set -euo pipefail
          test -f public/index.html
          test -f public/dashboard.css
          test -f public/dashboard.js
          test -f public/components.js
          test -f public/keybinds.js
          test -f public/views.js
          test -f public/favicon.svg
          # Project pages are hosted below /<repository>/, so asset URLs must
          # remain relative rather than point at the domain root.
          if grep -E '(src|href)="/' public/index.html; then
            echo "GitHub Pages project sites require relative asset paths in public/index.html." >&2
            exit 1
          fi
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check public/dashboard.js
          node --check public/components.js
          node --check public/keybinds.js
          node --check public/views.js
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
