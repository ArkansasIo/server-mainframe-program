<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<meta name="description" content="Mainframe Server System operator console">
<title>Operator Console</title>
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./dashboard.css">
</head>
<body>

<!--
  Fallback document.
  The Node server renders the live page at "/" with system identity and panel
  data. This static document is the browser-hosted equivalent for public/.
  Relative asset URLs are required for repository-subpath hosting on GitHub
  Pages (/<repository>/).
-->
<div id="app">
  <noscript>
    <p style="font-family:monospace;color:#d7e3ee;background:#0b0f14;padding:16px">
      The operator console requires JavaScript. The terminal gateway on port 3270 works without a browser.
    </p>
  </noscript>
</div>

<script>
  window.MF_BOOTSTRAP = {
    system: { name: 'MAINFRAME', sysplex: 'SYSPLEX', region: 'DEFAULT', version: '1.0.0' },
    // GitHub Pages serves static files only; skip API/storage boot checks.
    static: true,
    panels: [],
    httpPort: location.port || 8080,
    terminalPort: 3270,
    dataPort: 3271,
    generatedAt: new Date().toISOString(),
    static: true
  };
</script>

<script src="./components.js"></script>
<script src="./keybinds.js"></script>
<script src="./views.js"></script>
<script src="./dashboard.js"></script>

</body>
</html>
